<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Application</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:18px}.card{max-width:520px;margin:25px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 20px #0001}
h2{color:#1a365d;text-align:center}.demo{background:#fff7d6;padding:12px;border-radius:8px;text-align:center}
label{display:block;margin-top:14px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #bbb;border-radius:7px}
button{width:100%;padding:13px;margin-top:20px;background:#1a365d;color:#fff;border:0;border-radius:8px;font-size:16px}
</style></head><body>
<div class="card">
<div class="demo">DEMO ONLY — Use fake information such as Test User.</div>
<h2>📝 Demo Application</h2>
<form onsubmit="submitDemo(event)">
<label>Name</label><input id="name" value="Test User" required>
<label>Demo Reference</label><input id="ref" value="TEST-001" required>
<label>Demo Amount</label><input id="amount" value="100000" required>
<button>Application Submit කරන්න</button>
</form>
</div>
<script>
function submitDemo(e){
 e.preventDefault();
 localStorage.setItem("demoLoan",JSON.stringify({
   name:document.getElementById("name").value,
   ref:document.getElementById("ref").value,
   amount:document.getElementById("amount").value,
   status:"Pending"
 }));
 location.href="waiting.html";
}
</script></body></html>
