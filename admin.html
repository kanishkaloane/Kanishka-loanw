<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ණය කළමනාකරණය</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: white; padding: 20px; text-align: center; }
        .card { background: #333; padding: 20px; border-radius: 10px; max-width: 450px; margin: auto; text-align: left; box-shadow: 0px 0px 10px rgba(255,255,255,0.1); }
        button { background: #dc3545; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 15px; }
        .approved-btn { background: #28a745; }
        p { margin: 8px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="text-align: center;">🛡️ ඇමින් පාලක පුවරුව</h2>
        <div id="requestInfo">
            <p><strong>ජා.හැ. අංකය (NIC):</strong> <span id="adminNic">-</span></p>
            <p><strong>දුරකථන අංකය 1:</strong> <span id="adminPhone1">-</span></p>
            <p><strong>දුරකථන අංකය 2:</strong> <span id="adminPhone2">-</span></p>
            <p><strong>ලිපිනය:</strong> <span id="adminAddress">-</span></p>
            <p><strong>ඉල්ලූ මුදල:</strong> රු. <span id="adminAmount">-</span></p>
            <p><strong>බැංකු විස්තර:</strong> <span id="adminBank">-</span></p>
            <p><strong>തත්වය:</strong> <b id="adminStatus" style="color: orange;">Pending</b></p>
            
            <button class="approved-btn" onclick="approveLoan()">Approve කරන්න</button>
        </div>
    </div>

    <script>
        function loadAdminData() {
            const data = JSON.parse(localStorage.getItem('customerLoan'));
            if (data) {
                document.getElementById('adminNic').innerText = data.nic;
                document.getElementById('adminPhone1').innerText = data.phone1;
                document.getElementById('adminPhone2').innerText = data.phone2;
                document.getElementById('adminAddress').innerText = data.address;
                document.getElementById('adminAmount').innerText = data.amount;
                document.getElementById('adminBank').innerText = data.bank;
                
                if (data.status === 'approved') {
                    document.getElementById('adminStatus').innerText = "Approved ✅";
                    document.getElementById('adminStatus').style.color = "lightgreen";
                }
            }
        }

        function approveLoan() {
            let data = JSON.parse(localStorage.getItem('customerLoan'));
            if (data) {
                data.status = 'approved';
                localStorage.setItem('customerLoan', JSON.stringify(data));
                alert("සාර්ථකව අනුමත කරන ලදී!");
                loadAdminData();
            } else {
                alert("අයදුම්පත් කිසිවක් නොමැත!");
            }
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
