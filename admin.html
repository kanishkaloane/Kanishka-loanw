<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Demo</title>
<style>
body{font-family:Arial,sans-serif;background:#1e1e2f;color:#fff;margin:0;padding:18px}.card{max-width:520px;margin:25px auto;background:#2a2a40;padding:24px;border-radius:14px}
h2{text-align:center;color:#8fb3ff}.demo{background:#fff7d6;color:#333;padding:12px;border-radius:8px;text-align:center}
input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border-radius:7px;border:0}
button{background:#1cc88a;color:white;font-weight:bold;font-size:16px}
#panel{display:none}.info{background:#1e1e2f;padding:15px;border-radius:8px;margin-top:15px}
</style></head><body>
<div class="card">
<div class="demo">DEMO ADMIN — not secure authentication</div>
<h2>🛡️ Admin Demo Panel</h2>
<div id="login">
<input id="pw" type="password" placeholder="Demo password">
<button onclick="login()">Login</button>
</div>
<div id="panel">
<div id="data" class="info">No demo application.</div>
<button onclick="approve()">Approve Demo Application</button>
</div>
</div>
<script>
function login(){
 if(document.getElementById("pw").value==="demo123"){
   document.getElementById("login").style.display="none";
   document.getElementById("panel").style.display="block";
   load();
 } else alert("Demo password incorrect.");
}
function load(){
 const d=JSON.parse(localStorage.getItem("demoLoan")||"null");
 document.getElementById("data").innerHTML=d?
 `<p><b>Name:</b> ${d.name}</p><p><b>Reference:</b> ${d.ref}</p><p><b>Amount:</b> Rs. ${d.amount}</p><p><b>Status:</b> ${d.status}</p>`
 : "No demo application.";
}
function approve(){
 const d=JSON.parse(localStorage.getItem("demoLoan")||"null");
 if(!d) return alert("No demo application.");
 d.status="Approved";
 localStorage.setItem("demoLoan",JSON.stringify(d));
 load();
 alert("Demo application approved.");
}
</script></body></html>
