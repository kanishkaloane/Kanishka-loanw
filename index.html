<!DOCTYPE html>  
<html lang="si">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>ඉක්මන් ණය සේවාව</title>  
    <style>  
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }  
        .container { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }  
        h2, h3 { text-align: center; color: #2c3e50; }  
        .form-group { margin-bottom: 12px; }  
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }  
        input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 13px; }  
        button { background: #27ae60; color: white; border: none; padding: 11px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }  
        .calc-box { background: #e8f8f5; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; color: #117a65; text-align: center; }  
        .admin-link { text-align: center; margin-top: 15px; }  
        .admin-link a { color: #2980b9; text-decoration: none; font-size: 13px; font-weight: bold; }  
        .hidden { display: none; }  
        .loan-card { background: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; }  
        .status-btn { padding: 4px 8px; font-size: 11px; margin-top: 5px; cursor: pointer; }  
    </style>  
</head>  
<body>  
<div class="container">  
    <div id="userSection">  
        <h2>🚀 ඉක්මන් ණය සේවාව</h2>  
        <div class="calc-box">  
            ණය මුදල: <span id="displayAmount">රු. 25,000</span><br>  
            <b>ගෙවිය යුතු මුදල: <span id="displayTotal">රු. 27,500</span></b>  
        </div>  
        <form id="loanForm">  
            <div class="form-group"><label>නම</label><input type="text" id="name" required></div>  
            <div class="form-group"><label>දුරකථන අංකය (WhatsApp)</label><input type="tel" id="phone" required></div>  
            <div class="form-group"><label>හැඳුනුම්පත් අංකය (NIC)</label><input type="text" id="nic" required></div>  
            <div class="form-group">  
                <label>ණය මුදල</label>  
                <select id="amountSelect" onchange="calc()">  
                    <option value="10000">රු. 10,000</option>  
                    <option value="25000" selected>රු. 25,000</option>  
                    <option value="50000">රු. 50,000</option>  
                    <option value="100000">රු. 100,000</option>  
                </select>  
            </div>  
            <div class="form-group"><label>බැංකු විස්තර</label><input type="text" id="bank" required></div>  
            <button type="submit">ණය ඉල්ලුම් කරන්න</button>  
        </form>  
        <div class="admin-link"><a href="#" onclick="showAdmin()">🔐 Admin Dashboard වෙත යන්න</a></div>  
    </div>  
    <div id="adminSection" class="hidden">  
        <h3>🛡️ Admin Dashboard</h3>  
        <div id="list"></div>  
        <button style="background: #e74c3c;" onclick="showUser()">පෙර පිටුවට</button>  
    </div>  
</div>  
<script>  
    function calc() {  
        let amt = parseInt(document.getElementById('amountSelect').value);  
        document.getElementById('displayAmount').innerText = 'රු. ' + amt.toLocaleString();  
        document.getElementById('displayTotal').innerText = 'රු. ' + (amt + amt*0.1).toLocaleString();  
    }  
    document.getElementById('loanForm').addEventListener('submit', function(e) {  
        e.preventDefault();  
        let name = document.getElementById('name').value;  
        let phone = document.getElementById('phone').value;  
        let nic = document.getElementById('nic').value;  
        let amount = document.getElementById('amountSelect').value;  
        let bank = document.getElementById('bank').value;  
        let reqs = JSON.parse(localStorage.getItem('reqs')) || [];  
        reqs.push({ name, phone, nic, amount, bank, status: 'Pending' });  
        localStorage.setItem('reqs', JSON.stringify(reqs));  
        let msg = `*නව ණය අයදුම්පතක්!*%0A%0Aනම: ${name}%0Aදුරකථන: ${phone}%0ANIC: ${nic}%0Aමුදල: රු. ${amount}%0Aබැංකුව: ${bank}`;  
        window.location.href = `https://wa.me/94769233462?text=${msg}`;  
    });  
    function showAdmin() {  
        document.getElementById('userSection').classList.add('hidden');  
        document.getElementById('adminSection').classList.remove('hidden');  
        let list = document.getElementById('list');  
        let reqs = JSON.parse(localStorage.getItem('reqs')) || [];  
        if(reqs.length === 0) { list.innerHTML = 'ඉල්ලීම් නැත'; return; }  
        let h = '';  
        reqs.forEach((r, i) => {  
            h += `<div class="loan-card"><b>${r.name}</b> (${r.phone})<br>මුදල: රු. ${r.amount}<br>තත්ත්වය: ${r.status}<br><button class="status-btn" style="background:#27ae60;" onclick="up(${i},'Approved')">Approve</button> <button class="status-btn" style="background:#c0392b;" onclick="up(${i},'Rejected')">Reject</button></div>`;  
        });  
        list.innerHTML = h;  
    }  
    function showUser() {  
        document.getElementById('adminSection').classList.add('hidden');  
        document.getElementById('userSection').classList.remove('hidden');  
    }  
    function up(i, s) {  
        let reqs = JSON.parse(localStorage.getItem('reqs')) || [];  
        reqs[i].status = s;  
        localStorage.setItem('reqs', JSON.stringify(reqs));  
        showAdmin();  
    }  
</script>  
</body>  
</html>
