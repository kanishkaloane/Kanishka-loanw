<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanishka Loan Service - ණය අයදුම්පත</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            background: #ffffff;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #075e54;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1ebe5d;
        }
        #success-message {
            display: none;
            text-align: center;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kanishka Loan Service</h2>
    
    <form id="loanForm" action="https://formspree.io/f/xvkopknb" method="POST">
        <div class="form-group">
            <label for="fullName">සම්පූර්ණ නම:</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
            <label for="nic">ජාතික හැඳුනුම්පත් අංකය (NIC):</label>
            <input type="text" id="nic" name="nic" required>
        </div>

        <div class="form-group">
            <label for="phone">දුරකථන අංකය:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
            <label for="amount">අවශ්‍ය ණය මුදල (රු.):</label>
            <input type="number" id="amount" name="amount" required>
        </div>

        <div class="form-group">
            <label for="bank">බැංකුව සහ ශාඛාව:</label>
            <input type="text" id="bank" name="bank" required>
        </div>

        <div class="form-group">
            <label for="accountNo">බැංකු ගිණුම් අංකය:</label>
            <input type="text" id="accountNo" name="accountNo" required>
        </div>

        <button type="submit">අයදුම්පත යොමු කරන්න</button>
    </form>

    <div id="success-message">
        ස්තුතියි! ඔබගේ ණය අයදුම්පත සාර්ථකව යොමු කරන ලදී. අපි ඉක්මනින් ඔබව සම්බන්ධ කරගන්නෙමු.
    </div>
</div>

<script>
    const form = document.getElementById('loanForm');
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = new FormData(form);
        
        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                form.style.display = 'none';
                document.getElementById('success-message').style.display = 'block';
            } else {
                alert('යשהו වැරදුණා. කරුණාකර නැවත උත්සාහ කරන්න.');
            }
        } catch (error) {
            alert('සම්බන්ධතා දෝෂයක් සිදු විය.');
        }
    });
</script>

</body>
</html>
